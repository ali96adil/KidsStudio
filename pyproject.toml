[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidsstudio"
version = "0.1.0"
description = "Rig-first production tooling for an original bilingual children's animation studio"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<13",
]

[project.scripts]
kidsstudio = "kidsstudio.cli:main"
studioctl = "kidsstudio.studio_cli:main"
studio-worker = "kidsstudio.local_worker:main"
studio-coordinator = "kidsstudio.coordinator_api:main"
studio-remote-worker = "kidsstudio.remote_worker:main"
studio-media-worker = "kidsstudio.media_worker:main"
studio-dashboard = "kidsstudio.studio_dashboard:main"
studio-source-preflight = "kidsstudio.episode_sources:main"
studio-episode-qa = "kidsstudio.episode_quality:main"
studio-engine-qualify = "kidsstudio.engine_qualification:main"
studio-archive = "kidsstudio.private_archive:main"
studio-private-readiness = "kidsstudio.private_release:main"
studio-backup-drill = "kidsstudio.backup_drill:main"
studio-acceptance-review = "kidsstudio.acceptance_review:main"
studio-mac-contract = "kidsstudio.mac_contract:main"
studio-audio-continuity = "kidsstudio.audio_continuity:main"
studio-import-bunny = "kidsstudio.private_asset_intake:main"
studio-handoff-review = "kidsstudio.handoff_review:main"
studio-assembly-lineage = "kidsstudio.assembly_lineage:main"
studio-scene-assembly = "kidsstudio.scene_assembly:main"
studio-scene-catalogue = "kidsstudio.scene_catalogue:main"
studio-learning = "kidsstudio.studio_learning:main"
studio-mac-quick-probe = "kidsstudio.mac_quick_probe:main"
studio-two-scene-preflight = "kidsstudio.two_scene_preflight:main"
studio-m13-snapshot-gate = "kidsstudio.m13_snapshot_gate:main"
studio-live-m13-preflight = "kidsstudio.live_m13_preflight:main"
studio-voice-qa = "kidsstudio.voice_qa:main"
studio-preview-review = "kidsstudio.preview_review_cli:main"
studio-owner-review = "kidsstudio.owner_review_ui:main"
studio-youtube-private-upload = "kidsstudio.youtube_private_upload:main"
studio-private-policy = "kidsstudio.private_policy_cli:main"
studio-private-upload-agent = "kidsstudio.private_upload_agent:main"
studio-capture-real-evidence = "kidsstudio.real_media_evidence:main"
studio-real-vision-review = "kidsstudio.local_vision_review:main"
studio-bind-vision-m10 = "kidsstudio.local_vision_review:main_sign"
studio-review-script-ai = "kidsstudio.script_ai_quality:main"
studio-orchestrator = "kidsstudio.studio_orchestrator:main"
studio-cycle = "kidsstudio.studio_cycle:main"
studio-real-audio-review = "kidsstudio.local_audio_review:main"
studio-import-audio-review = "kidsstudio.audio_review_import:main"
studio-import-visual-review = "kidsstudio.visual_review_import:main"
studio-synchronized-av-review = "kidsstudio.synchronized_av_review:main"
studio-import-synchronized-av = "kidsstudio.synchronized_av_import:main"
studio-pilot-readiness = "kidsstudio.studio_pilot_readiness:main"

[tool.setuptools.packages.find]
include = ["kidsstudio*"]

[tool.setuptools.package-data]
kidsstudio = ["*.gd", "dashboard_assets/*.html", "dashboard_assets/*.js", "dashboard_assets/*.css"]
