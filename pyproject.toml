[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidsstudio"
version = "0.1.0"
description = "Rig-first production tooling for an original bilingual children's animation studio"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<13",
]

[project.scripts]
kidsstudio = "kidsstudio.cli:main"

[tool.setuptools.packages.find]
include = ["kidsstudio*"]
